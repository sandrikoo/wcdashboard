name: Update World Cup Results

on:
  workflow_dispatch:
  schedule:
    # Runs around likely post-match windows in UTC during June/July.
    # The script calls the API only when a match is already past its expected end time.
    - cron: "20,50 0-5,18-23 * 6,7 *"

permissions:
  contents: write

concurrency:
  group: update-world-cup-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update bracket slots
        env:
          THESTATSAPI_KEY: ${{ secrets.THESTATSAPI_KEY }}
          THESTATSAPI_COMPETITION_ID: "comp_6107"
          THESTATSAPI_SEASON_ID: "sn_118868"
          RESULT_CHECK_BUFFER_MINUTES: "10"
        run: node scripts/update-world-cup-results.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No bracket changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update World Cup bracket"
          git push
